<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SysMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById('root');
          if (!root || root.dataset.appMounted === 'true') return;
          root.innerHTML = '<main style="box-sizing:border-box;min-height:100vh;padding:32px;font:14px/1.55 system-ui,sans-serif;color:#7f1d1d;background:#fff7ed"><h1 style="margin:0 0 12px;font-size:20px">SysMind failed to start</h1><p style="margin:0 0 16px">The desktop app could not load its interface. Error details:</p><pre style="white-space:pre-wrap;word-break:break-word;padding:16px;background:#fff;border:1px solid #fed7aa;border-radius:6px">' + String(message).replace(/[&<>]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[char]) + '</pre></main>';
        };
        window.addEventListener('error', (event) => showStartupError(event.error?.stack || event.message));
        window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.stack || event.reason));
        window.__sysmindStartupError = showStartupError;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
